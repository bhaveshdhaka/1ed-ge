services:
  site:
    build: .
    image: 1edge-site
    container_name: 1edge-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321"
    env_file: .env
    volumes:
      # Env-driven content/data paths — DATA_PATH/MEDIA_PATH/DATA_DIR from .env
      # (defaults to in-repo src/content, public/media, data).
      - ${DATA_PATH:-./src/content}:/app/src/content
      - ${MEDIA_PATH:-./public/media}:/app/public/media
      - ${DATA_DIR:-./data}:/app/data
