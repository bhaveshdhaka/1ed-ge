services:
  site:
    build: .
    image: 1edge-site
    container_name: 1edge-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321"
    env_file: .env
    volumes:
      # Host mount paths are EXPLICIT (not ${DATA_*}): the container's .env uses
      # CONTAINER paths (/app/...) for the SSR server, but docker-compose
      # interpolates ${DATA_*} from that same .env on the HOST — which would
      # mount /app/data:/app/data (wrong). Pin the host side here so the
      # container sees the real host content/data volumes.
      - /srv/1edge/content:/app/src/content
      - /srv/1edge/media:/app/public/media
      - /srv/1edge/data:/app/data
