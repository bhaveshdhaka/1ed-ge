<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const qs = new URLSearchParams(location.search);

  /* S09 a11y demo: dynamic type — rem type scale survives the bump */
  (() => {
    const dt = parseFloat(qs.get("dt"));
    if (Number.isFinite(dt) && dt >= 0.8 && dt <= 2) document.documentElement.style.fontSize = (dt * 100) + "%";
  })();
  const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  const DOWS = ["sun","mon","tue","wed","thu","fri","sat"];
  const DOW_IDX = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
  const pad = (n) => String(n).padStart(2, "0");
  const CT = "America/Chicago";
  const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

  /* ================================================================
     TIME ENGINE — ?at=<hkt wall> freezes every readout (S01 doctrine)
     ================================================================ */
  const AT_MS = (() => {
    const raw = qs.get("at");
    if (!raw) return null;
    const ms = Date.parse(`${raw.length === 13 ? raw + ":00" : raw}+08:00`);
    return Number.isFinite(ms) ? ms : null;
  })();
  const LIVE = AT_MS === null;
  const nowMs = () => LIVE ? Date.now() : AT_MS;

  function tzParts(tz, ms) {
    const p = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23",
      weekday: "short", year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit" }).formatToParts(new Date(ms));
    const o = {}; for (const x of p) o[x.type] = x.value; return o;
  }
  const isoOfParts = (o) => `${o.year}-${o.month}-${o.day}`;
  const hktIsoAt = (ms) => isoOfParts(tzParts("Asia/Hong_Kong", ms));
  function tzOffMin(tz, ms) {
    const o = tzParts(tz, ms);
    const asUTC = Date.UTC(+o.year, +o.month - 1, +o.day, +o.hour, +o.minute);
    return Math.round((asUTC - ms) / 60000);
  }
  function wallUTC(tz, iso, hh, mm) {
    const [y, m, d] = iso.split("-").map(Number);
    const guess = Date.UTC(y, m - 1, d, hh, mm);
    return guess - tzOffMin(tz, new Date(guess)) * 60000;
  }
  const addIso = (iso, n) => {
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d + n));
    return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}-${pad(dt.getUTCDate())}`;
  };
  const dowOfIso = (iso) => {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
  };
  const dateOfIso = (iso) => new Date(`${iso}T12:00:00Z`);
  const fmtDay = (d) => `${pad(d.getDate())}-${MONTHS[d.getMonth()]}-${d.getFullYear()}`;
  const hkHM = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Hong_Kong", hourCycle: "h23", hour: "2-digit", minute: "2-digit" });
  const hkHHMM = (ms) => hkHM.format(new Date(ms));
  /* COUNTDOWN GRAMMAR — S01 r2.2 + S05 extension: ≥1d reads "5d 1h";
     seconds ONLY on timers/news T-15m. bare colon forms banned. */
  const fmtDur = (ms, secs = false) => {
    let s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600); s -= h * 3600;
    const m = Math.floor(s / 60), ss = s % 60;
    if (h >= 24) { const d = Math.floor(h / 24), hh = h % 24; return hh ? `${d}d ${hh}h` : `${d}d`; }
    if (h > 0) return secs ? `${h}h ${pad(m)}m ${pad(ss)}s` : `${h}h ${m}m`;
    if (secs) return `${m}m ${pad(ss)}s`;
    return m >= 1 ? `${m}m` : "<1m";
  };

  /* ================================================================
     CME MASTER CLOCK — faithful mock port of src/lib/market.ts
     ================================================================ */
  const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const isoD = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const nthWd = (y, m, wd, n) => {
    const f = new Date(y, m, 1), diff = (wd - f.getDay() + 7) % 7;
    return addD(f, diff + (n - 1) * 7);
  };
  const lastWd = (y, m, wd) => {
    const l = new Date(y, m + 1, 0);
    return addD(l, -((l.getDay() - wd + 7) % 7));
  };
  const observed = (d) => d.getDay() === 6 ? addD(d, -1) : d.getDay() === 0 ? addD(d, 1) : d;
  function easter(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d2 = Math.floor(b / 4), e2 = b % 4,
      f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d2 - g + 15) % 30,
      i2 = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e2 + 2 * i2 - h - k) % 7,
      mm = Math.floor((a + 11 * h + 22 * l) / 451),
      month = Math.floor((h + l - 7 * mm + 114) / 31),
      day = ((h + l - 7 * mm + 114) % 31) + 1;
    return new Date(y, month - 1, day);
  }
  const MEM = new Map();
  const once = (key, fn) => { if (!MEM.has(key)) MEM.set(key, fn()); return MEM.get(key); };
  const cmeHolidays = (y) => once(`ch${y}`, () => [
    observed(new Date(y, 0, 1)), addD(easter(y), -2), observed(new Date(y, 5, 19)),
    observed(new Date(y, 6, 4)), nthWd(y, 10, 4, 4), observed(new Date(y, 11, 25)),
  ].map(isoD));
  const nyseHolidays = (y) => once(`nh${y}`, () => [
    observed(new Date(y, 0, 1)), nthWd(y, 0, 1, 3), nthWd(y, 1, 1, 3), addD(easter(y), -2),
    lastWd(y, 4, 1), observed(new Date(y, 5, 19)), observed(new Date(y, 6, 4)),
    nthWd(y, 8, 1, 1), nthWd(y, 10, 4, 4), observed(new Date(y, 11, 25)),
  ].map(isoD));
  const japanHolidays = (y) => once(`jh${y}`, () => {
    const eq = (c) => Math.floor(c + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
    const base = [
      new Date(y, 0, 1), new Date(y, 0, 2), nthWd(y, 0, 1, 2), new Date(y, 1, 11), new Date(y, 1, 23),
      new Date(y, 2, eq(20.8431)), new Date(y, 3, 29), new Date(y, 4, 3), new Date(y, 4, 4), new Date(y, 4, 5),
      nthWd(y, 6, 1, 3), new Date(y, 7, 11), nthWd(y, 8, 1, 3), new Date(y, 8, eq(23.2488)),
      nthWd(y, 9, 1, 2), new Date(y, 10, 3), new Date(y, 10, 23),
    ];
    const set = new Set(base.map(isoD));
    for (const d of base) if (d.getDay() === 0) {
      let sub = addD(d, 1);
      while (set.has(isoD(sub)) || sub.getDay() === 0 || sub.getDay() === 6) sub = addD(sub, 1);
      set.add(isoD(sub));
    }
    return [...set];
  });
  const ukHolidays = (y) => once(`uh${y}`, () => {
    const shift = (d) => (d.getDay() === 0 || d.getDay() === 6 ? addD(d, 2) : d);
    const ny = new Date(y, 0, 1);
    return [...new Set([
      ny.getDay() === 6 ? addD(ny, 2) : ny.getDay() === 0 ? addD(ny, 1) : ny,
      addD(easter(y), -2), addD(easter(y), 1),
      nthWd(y, 4, 1, 1), lastWd(y, 4, 1), lastWd(y, 7, 1),
      shift(new Date(y, 11, 25)), shift(new Date(y, 11, 26)),
    ].map(isoD))];
  });
  const isTradingDay = (iso, hol) => dowOfIso(iso) !== 0 && dowOfIso(iso) !== 6 && !hol.has(iso);
  const cmeStatus = (iso) => {
    const wd = dowOfIso(iso);
    if (wd === 0 || wd === 6) return { kind: "closed", reason: "weekend" };
    const y = +iso.slice(0, 4);
    if (cmeHolidays(y).includes(iso) || cmeHolidays(y + 1).includes(iso) || cmeHolidays(y - 1).includes(iso))
      return { kind: "closed", reason: "holiday" };
    for (const e of once(`eh${y}`, () => [
      { iso: isoD(nthWd(y, 0, 1, 3)), hh: 12, mm: 0 }, { iso: isoD(nthWd(y, 1, 1, 3)), hh: 12, mm: 0 },
      { iso: isoD(lastWd(y, 4, 1)), hh: 12, mm: 0 },
    ])) if (e.iso === iso && dowOfIso(e.iso) !== 0 && dowOfIso(e.iso) !== 6) return { kind: "early-halt", hh: e.hh, mm: e.mm };
    for (const e of once(`ec${y}`, () => {
      const jul4 = new Date(y, 6, 4);
      return [
        { iso: isoD(addD(nthWd(y, 10, 4, 4), 1)), hh: 13, mm: 15 },
        { iso: `${y}-12-24`, hh: 13, mm: 15 }, { iso: `${y}-12-31`, hh: 13, mm: 15 },
        ...(jul4.getDay() === 6 ? [{ iso: isoD(addD(jul4, -2)), hh: 12, mm: 0 }] : []),
      ];
    })) if (e.iso === iso && dowOfIso(e.iso) !== 0 && dowOfIso(e.iso) !== 6) return { kind: "early", hh: e.hh, mm: e.mm };
    return { kind: "open" };
  };
  const rank = { open: 0, halt: 1, close: 2 };
  const boundsCache = new Map();
  function boundsAround(centerIso) {
    if (!boundsCache.has(centerIso)) {
      const out = [];
      for (let i = -4; i <= 11; i++) {
        const D = addIso(centerIso, i), st = cmeStatus(D);
        if (st.kind === "closed") continue;
        out.push({ ms: wallUTC(CT, addIso(D, -1), 17, 0), t: "open", iso: D });
        if (st.kind === "early") out.push({ ms: wallUTC(CT, D, st.hh, st.mm), t: "close", iso: D });
        else if (cmeStatus(addIso(D, 1)).kind === "closed") out.push({ ms: wallUTC(CT, D, 16, 0), t: "close", iso: D });
        else {
          if (st.kind === "early-halt") out.push({ ms: wallUTC(CT, D, st.hh, st.mm), t: "halt", iso: D });
          out.push({ ms: wallUTC(CT, D, 16, 0), t: "halt", iso: D });
        }
      }
      out.sort((a, b) => a.ms - b.ms || rank[a.t] - rank[b.t]);
      boundsCache.set(centerIso, out);
    }
    return boundsCache.get(centerIso);
  }
  function windowFor(iso) {
    const bs = boundsAround(iso);
    const open = bs.find((b) => b.t === "open" && b.iso === iso);
    if (!open) return null;
    const mine = bs.filter((b) => b.iso === iso && b.t !== "open");
    return { open: open.ms, end: mine.length ? mine[mine.length - 1].ms : open.ms + 1380 * 60000, iso };
  }
  function phaseAt(ms) {
    const bs = boundsAround(hktIsoAt(ms));
    let cur = null;
    for (const b of bs) { if (b.ms <= ms) cur = b; else break; }
    const next = bs.find((b) => b.ms > ms) || null;
    if (!cur || cur.t === undefined) return { phase: "closed", reason: "weekend", untilMs: next?.ms ?? ms };
    if (cur.t === "open") return { phase: "open", untilMs: next.ms, iso: cur.iso };
    if (cur.t === "halt") {
      const st = cmeStatus(cur.iso);
      return { phase: "halt", early: st.kind === "early-halt", untilMs: next.ms, iso: cur.iso };
    }
    const st = cmeStatus(cur.iso);
    const reason = st.kind === "early" ? "early close"
      : dowOfIso(cur.iso) === 5 ? "weekend" : "holiday";
    return { phase: "closed", reason, untilMs: next?.ms ?? ms };
  }
  function sessSpans(iso) {
    const st = cmeStatus(iso);
    if (st.kind === "closed") return null;
    const win = windowFor(iso);
    const clampEnd = st.kind === "early" ? wallUTC(CT, iso, st.hh, st.mm) : win.end;
    const mk = (tz, aH, aM, bH, bM) => {
      const s = wallUTC(tz, iso, aH, aM), e = wallUTC(tz, iso, bH, bM);
      if (e <= win.open || s >= clampEnd) return null;
      return [Math.max(s, win.open), Math.min(e, clampEnd)];
    };
    const jp = new Set(japanHolidays(+iso.slice(0, 4)));
    const uk = new Set(ukHolidays(+iso.slice(0, 4)));
    const us = new Set(nyseHolidays(+iso.slice(0, 4)));
    const usEarly = nyseHolidays(+iso.slice(0, 4)).includes(iso) ? null :
      (st.kind === "early" ? 13 : 16);
    const tok = [];
    if (isTradingDay(iso, jp)) {
      const a = mk("Asia/Tokyo", 9, 0, 11, 30), b = mk("Asia/Tokyo", 12, 30, 15, 30);
      if (a) tok.push(a); if (b) tok.push(b);
    }
    const lon = isTradingDay(iso, uk) ? [mk("Europe/London", 8, 0, 16, 30)].filter(Boolean) : [];
    const nyc = isTradingDay(iso, us) && usEarly ? [mk("America/New_York", 9, 30, usEarly, 0)].filter(Boolean) : [];
    return { tok, lon, nyc };
  }

  /* ================================================================
     CHROME — topbar, chrono band, sessions rail (no strip: S06 shells
     are config surfaces, not day-anchored ones)
     ================================================================ */
  const band = $("band"), nowmark = $("nowmark"), ruler = $("ruler"), bandCap = $("band-cap");
  const NOW0 = nowMs();
  const TODAY_ISO = hktIsoAt(NOW0);
  function effIso() {
    const ph = phaseAt(nowMs());
    return ph.iso ?? TODAY_ISO;
  }
  function buildBand() {
    band.querySelectorAll(".sp").forEach((n) => n.remove());
    ruler.innerHTML = "";
    const iso = effIso();
    const win = windowFor(iso);
    const spans = sessSpans(iso);
    if (!win) {
      band.classList.add("is-dim");
      nowmark.style.display = "none";
      bandCap.hidden = false;
      bandCap.textContent = `no cme session · ${cmeStatus(iso).reason}`;
      return;
    }
    bandCap.hidden = true;
    band.classList.remove("is-dim");
    const pct = (ms) => ((ms - win.open) / (win.end - win.open) * 100).toFixed(3) + "%";
    for (const [name, arr] of Object.entries(spans || {})) {
      for (const [s, e] of arr) {
        const f = document.createElement("div");
        f.className = `sp s-${name}`;
        f.style.left = pct(s);
        f.style.width = ((e - s) / (win.end - win.open) * 100).toFixed(3) + "%";
        band.appendChild(f);
      }
    }
    for (let k = 180; k < 1380; k += 180) {
      const major = k % 360 === 0;
      const t = document.createElement("i");
      t.className = "tick" + (major ? " major" : "");
      t.style.left = (k / 1380 * 100).toFixed(3) + "%";
      ruler.appendChild(t);
      if (major) {
        const lab = document.createElement("span");
        lab.className = "tlab";
        lab.style.left = (k / 1380 * 100).toFixed(3) + "%";
        lab.textContent = hkHHMM(win.open + k * 60000).slice(0, 2);
        ruler.appendChild(lab);
      }
    }
    band.dataset.open = win.open; band.dataset.end = win.end;
  }
  const MKT_LABEL = { open: ["cme · open", "is-open"], halt: ["cme · halt", "is-open"], closed: ["cme · closed", ""] };
  function renderClock() {
    const now = nowMs();
    const ph = phaseAt(now);
    const live = ph.phase === "open";
    $("topbar").classList.toggle("is-live", live);
    const [label, cls] = ph.phase === "closed" && ph.reason === "holiday"
      ? ["cme · holiday", "is-holiday"] : MKT_LABEL[ph.phase];
    $("mkt-label").textContent = label;
    $("mkt").className = "capsule mkt " + cls;
    const remainS = Math.max(0, Math.floor((ph.untilMs - now) / 1000));
    $("mkt-cd").textContent = fmtDur(remainS * 1000);

    const winOpen = +band.dataset.open, winEnd = +band.dataset.end;
    const inWin = Number.isFinite(winOpen) && now >= winOpen && now < winEnd;
    band.classList.toggle("is-dim", !inWin);
    nowmark.style.display = inWin ? "" : "none";
    if (inWin) nowmark.style.left = `calc(${((now - winOpen) / (winEnd - winOpen) * 100).toFixed(3)}% - 1px)`;

    const spans = sessSpans(effIso());
    const railDefs = [["tok", spans?.tok], ["lon", spans?.lon], ["nyc", spans?.nyc]];
    for (const [name, arr] of railDefs) {
      const el = $("sess-" + name), stEl = $("st-" + name), swEl = $("sw-" + name);
      el.classList.remove("is-live");
      if (!arr || !arr.length) {
        stEl.textContent = "closed";
        swEl.textContent = "no session";
        continue;
      }
      swEl.textContent = `${hkHHMM(arr[0][0])}–${hkHHMM(arr[arr.length - 1][1])} hkt`;
      const cur = arr.find(([s, e]) => now >= s && now < e);
      if (cur) {
        el.classList.add("is-live");
        stEl.innerHTML = `<span class="live-dot" aria-hidden="true"></span>live · <b>${fmtDur(cur[1] - now)}</b> left`;
      } else if (name === "tok" && arr.length === 2 && now >= arr[0][1] && now < arr[1][0]) {
        stEl.innerHTML = `back in <b>${fmtDur(arr[1][0] - now)}</b>`;
      } else {
        const nx = arr.find(([s]) => s > now);
        if (!nx) stEl.textContent = now >= winEnd ? "done" : "closed";
        else if (now < winOpen) stEl.textContent = "scheduled";
        else stEl.innerHTML = `opens in <b>${fmtDur(nx[0] - now)}</b>`;
      }
    }

    if (!LIVE) {
      $("sim-chip").hidden = false;
      const o = tzParts("Asia/Hong_Kong", now);
      $("today-date").textContent = `${DOWS[DOW_IDX[o.weekday]]} ${o.day} ${MONTHS[+o.month - 1]} · ${o.hour}:${o.minute} hkt · mock`;
    } else {
      $("today-date").textContent = fmtDay(dateOfIso(TODAY_ISO));
    }
  }

  /* ================================================================
     MEDIA — thumb grid (svg chart placeholders, seeded + stable),
     filter seg, storage line, detail sheet: alt text + attach day.
     ================================================================ */
  let MEDIA = [
    { day: "28-aug-2026", alt: "mnq 5m into ny open — trend pull entry", seed: 11 },
    { day: "28-aug-2026", alt: "tok session fade marked up", seed: 23 },
    { day: null, alt: "", seed: 35 },
    { day: "27-aug-2026", alt: "failed globex reversion — lesson shot", seed: 47 },
    { day: "27-aug-2026", alt: "vwap reclaim context", seed: 59 },
    { day: null, alt: "", seed: 61 },
    { day: "26-aug-2026", alt: "london range before nyc", seed: 73 },
    { day: "26-aug-2026", alt: "halt resume spike — no trade", seed: 87 },
    { day: "25-aug-2026", alt: "best trade of the week, full ticket", seed: 91 },
    { day: null, alt: "", seed: 103 },
    { day: "22-aug-2026", alt: "news window lockout example", seed: 113 },
    { day: "21-aug-2026", alt: "payout day equity curve", seed: 127 },
  ];
  let filter = qs.get("f") || "all";
  if (!["all", "attached", "unattached"].includes(filter)) filter = "all";
  let emptyGrid = qs.get("empty") === "1";

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function thumbSvg(seed) {
    const rnd = mulberry32(seed);
    let py = 12 + rnd() * 14;
    const n = 13, step = 88 / n;
    const out = [];
    for (let i = 0; i < n; i++) {
      const o = py;
      let c = py + (rnd() - 0.47) * 13;
      c = Math.max(6, Math.min(36, c));
      const hi = Math.min(o, c) - rnd() * 4.5;
      const lo = Math.max(o, c) + rnd() * 4.5;
      const x = 5 + i * step + 1;
      out.push(`<line x1="${x.toFixed(1)}" y1="${Math.max(1, hi).toFixed(1)}" x2="${x.toFixed(1)}" y2="${Math.min(39, lo).toFixed(1)}" stroke="var(--line3)" stroke-width="1" vector-effect="non-scaling-stroke"/>` +
        `<rect x="${(x - 2.4).toFixed(1)}" y="${Math.min(o, c).toFixed(1)}" width="4.8" height="${Math.max(1.4, Math.abs(c - o)).toFixed(1)}" fill="${c <= o ? "var(--up)" : "var(--down)"}" opacity="0.85"/>`);
      py = c;
    }
    return `<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><rect width="100" height="40" fill="var(--inset)"/>${out.join("")}</svg>`;
  }

  function render() {
    const rows = emptyGrid ? [] : MEDIA.filter((m) =>
      filter === "all" ? true : filter === "attached" ? !!m.day : !m.day);
    const att = MEDIA.filter((m) => m.day).length;
    $("pg-sub").textContent = `${MEDIA.length} shots · ${att} attached · ${MEDIA.length - att} loose`;
    $("usage-cap").textContent = `${112 + MEDIA.length} files · 214.6 mb of 2.0 gb · webp`;
    $("usage-fill").style.width = ((214.6 / 2048) * 100).toFixed(1) + "%";
    const grid = $("mgrid");
    grid.innerHTML = rows.length
      ? rows.map((m, i) => `<button type="button" class="mthumb" data-i="${MEDIA.indexOf(m)}" aria-label="${esc(m.alt || "unattached screenshot")}">
          ${thumbSvg(m.seed)}
          ${m.day ? `<span class="mchip">${m.day}</span>` : ""}
        </button>`).join("")
      : `<p class="empty mempty">${{ all: "no media yet — screenshots attach from the composer.", attached: "every screenshot is attached to a day.", unattached: "no loose shots — everything is filed." }[filter]}</p>`;
    grid.querySelectorAll(".mthumb").forEach((b) =>
      b.addEventListener("click", () => openSheet(MEDIA[+b.dataset.i])));
    document.querySelectorAll("#media-seg [data-f], #dev-seg [data-f]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.f === filter)));
  }

  /* ---- detail sheet: alt text + attach-to-day (real form) ---- */
  const sheet = $("sh"), shForm = $("sh-form"), shBody = $("sh-body");
  let current = null, lastFocus = null;
  function openSheet(m) {
    current = m;
    lastFocus = document.activeElement;
    $("sh-title").textContent = `shot-${String(MEDIA.indexOf(m) + 1).padStart(3, "0")}.webp`;
    $("sh-sub").textContent = m.day ? `attached · ${m.day}` : "unattached";
    shBody.innerHTML = `
      <div class="sh-preview">${thumbSvg(m.seed)}</div>
      <label class="sh-field"><span class="label">alt text</span>
        <input class="input" type="text" name="alt" value="${esc(m.alt)}" placeholder="what this shot shows" autocomplete="off"></label>
      <div class="sh-field"><span class="label">attach to day</span>
        <input class="input" type="date" name="attach_day" value="2026-08-28">
        <p class="empty" style="margin-top:4px;">leaving a date attaches the shot to that day on save.</p></div>`;
    sheet.showModal();
  }
  shForm.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!current) return;
    const fd = new FormData(shForm);
    current.alt = String(fd.get("alt") || "").trim();
    const day = String(fd.get("attach_day") || "").trim();
    if (day) {
      const d = new Date(`${day}T12:00:00Z`);
      current.day = `${String(d.getUTCDate()).padStart(2, "0")}-${MONTHS[d.getUTCMonth()]}-${d.getUTCFullYear()}`;
    }
    toastMsg(current.day ? `saved · attached ${current.day}` : "saved");
    render();
    sheet.close();
  });
  $("sh-cancel").addEventListener("click", () => sheet.close());
  sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); });
  sheet.addEventListener("close", () => { lastFocus?.focus?.({ preventScroll: true }); });

  /* ---- filter seg + devrail (roundtrip through URL) ---- */
  function setFilter(v) {
    filter = v;
    const u = new URL(location); u.searchParams.set("f", v);
    history.replaceState(null, "", u);
    render();
  }
  $("media-seg").addEventListener("click", (e) => { if (e.target.dataset.f) setFilter(e.target.dataset.f); });
  $("dev-seg").addEventListener("click", (e) => { if (e.target.dataset.f) setFilter(e.target.dataset.f); });
  $("empty-seg").addEventListener("click", (e) => {
    const v = e.target.dataset.e; if (!v) return;
    emptyGrid = v === "empty";
    document.querySelectorAll("#empty-seg [data-e]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.e === v)));
    render();
  });
  if (emptyGrid) {
    document.querySelectorAll("#empty-seg [data-e]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.e === "empty")));
  }

  /* ---- palette data (page-owned; machinery is shared S06 code) ---- */
  const ITEMS = [
    { sec: "jump", label: "grid", hint: "g m", go: "sec-grid" },
    { sec: "compose", label: "thought", hint: "n", url: "composer.html?mode=thought" },
    { sec: "compose", label: "quote", hint: "q", url: "composer.html?mode=quote" },
    { sec: "compose", label: "trade", hint: "t", url: "composer.html?mode=trade" },
    { sec: "screens", label: "today rail", url: "today.html" },
    { sec: "screens", label: "rituals", url: "rituals.html" },
    { sec: "screens", label: "evening", url: "evening.html" },
    { sec: "screens", label: "cockpit", url: "index.html" },
    { sec: "settings", label: "accounts", url: "accounts.html" },
    { sec: "settings", label: "library", url: "library.html" },
    { sec: "settings", label: "zen settings", url: "settings.html" },
  ];
  const CHORDS = { m: "sec-grid" };
  const COMPOSE_KEYS = { n: "thought", q: "quote", t: "trade" };

  render();
  /* ---- toast ---- */
  const toastEl = $("toast"), toastMsgEl = $("toast-msg"), drainEl = $("toast-drain");
  let toastTimer = null;
  function toastMsg(text) {
    toastMsgEl.textContent = text;
    toastEl.hidden = false;
    drainEl.style.transition = "none"; drainEl.style.transform = "scaleX(1)";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      drainEl.style.transition = "transform 2.4s linear"; drainEl.style.transform = "scaleX(0)";
    }));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2400);
  }

  /* ---- command palette (⌘K reaches everything in ≤2 actions) ---- */
  const palette = $("palette"), palInput = $("pal-input"), palList = $("pal-list");
  let visible = [], cursor = 0, palLastFocus = null;
  function fuzzy(q, hay) {
    q = q.toLowerCase(); hay = hay.toLowerCase();
    const idx = hay.indexOf(q);
    if (idx >= 0) return idx === 0 || hay[idx - 1] === " " ? 0 : 1;
    let i = 0;
    for (const ch of hay) if (ch === q[i]) i++;
    return i === q.length ? 2 : -1;
  }
  function renderPal() {
    const q = palInput.value.trim();
    const pool = !q ? [...ITEMS]
      : ITEMS.map((i) => ({ item: i, s: fuzzy(q, i.label + " " + i.sec) }))
          .filter((x) => x.s >= 0).sort((a, b) => a.s - b.s).map((x) => x.item);
    visible = pool; cursor = 0;
    let html = "", lastSec = null;
    pool.forEach((i, n) => {
      if (i.sec !== lastSec) { html += `<p class="pal-sec">${i.sec}</p>`; lastSec = i.sec; }
      html += `<div class="pal-item" role="option" id="pal-o${n}" data-i="${n}" data-active="${n === cursor}" aria-selected="${n === cursor}">
                 <span class="grow">${i.label}</span><span class="hint">${i.hint}</span></div>`;
    });
    palList.innerHTML = html || `<p class="pal-empty empty">nothing matches “${q.replace(/</g, "&lt;")}”.</p>`;
    palInput.setAttribute("aria-activedescendant", pool.length ? `pal-o${cursor}` : "");
  }
  function moveCursor(delta) {
    if (!visible.length) return;
    cursor = (cursor + delta + visible.length) % visible.length;
    palList.querySelectorAll(".pal-item").forEach((el) =>
      el.dataset.active = String(+el.dataset.i === cursor));
    palList.querySelector(`[data-i="${cursor}"]`)?.scrollIntoView({ block: "nearest" });
    palInput.setAttribute("aria-activedescendant", `pal-o${cursor}`);
  }
  function jumpTo(id) {
    document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function pick() {
    const it = visible[cursor];
    if (!it) return;
    palette.close();
    if (it.go) jumpTo(it.go);
    else if (it.url) location.assign(it.url);
    else toastMsg(`mock → ${it.label}`);
  }
  function openPal() {
    palLastFocus = document.activeElement;
    palInput.value = ""; renderPal();
    palette.showModal();
    setTimeout(() => palInput.focus(), 60);
  }
  palette.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); moveCursor(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); moveCursor(-1); }
    else if (e.key === "Enter") { e.preventDefault(); pick(); }
  });
  palInput.addEventListener("input", renderPal);
  palList.addEventListener("click", (e) => {
    const it = e.target.closest(".pal-item");
    if (it) { cursor = +it.dataset.i; pick(); }
  });
  palette.addEventListener("click", (e) => { if (e.target === palette) palette.close(); });
  palette.addEventListener("close", () => { palLastFocus?.focus?.({ preventScroll: true }); });

  /* keyboard: ⌘K palette · / palette · g-chords · compose keys */
  let chordArm = 0;
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      palette.open ? palette.close() : openPal();
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
    if (e.key === "/") { e.preventDefault(); openPal(); return; }
    const nowT = Date.now();
    if (e.key.toLowerCase() === "g" && nowT - chordArm > 400) {
      chordArm = nowT;
      setTimeout(() => { chordArm = 0; }, 1200);
      return;
    }
    if (nowT - chordArm <= 1200) {
      const dest = CHORDS[e.key.toLowerCase()];
      if (dest) { chordArm = 0; jumpTo(dest); return; }
    }
    chordArm = 0;
    const m = COMPOSE_KEYS[e.key.toLowerCase()];
    if (m) location.assign(`composer.html?mode=${m}`);
  });
  const COARSE = matchMedia("(pointer: coarse)").matches;
  if (COARSE) {
    $("fab-k").hidden = false;
    $("fab-k").addEventListener("click", openPal);
  }

  /* ---- init + loop ---- */
  buildBand();
  renderClock();
  setInterval(renderClock, 1000);
})();
</script>
</body>
</html>
