name: Publish image to GHCR

# Builds the Docker image and pushes it to ghcr.io on every push to main or
# preprod. Coolify pulls the per-branch tag (:main / :preprod) and runs it —
# no self-hosted runner build context, no rsync, no /srv/1edge compose juggling.

on:
  push:
    branches: [main, preprod]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # Publish a per-branch tag (:main / :preprod) + git sha (+ :latest on
          # main only) so each Coolify app pulls the image for its environment.
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      # Trigger Coolify to pull the freshly published image for this environment.
      # main -> 1edge-prod, preprod -> 1edge-preprod.
      - name: Trigger Coolify deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          case "${{ github.ref }}" in
            refs/heads/main) uuids="oqz7u0yho3lulqdt0ymwdibx" ;;
            refs/heads/preprod) uuids="fyn2fhxrsltey8dr6k6plxg8" ;;
          esac
          for uuid in $uuids; do
            echo "deploying app $uuid"
            curl -sf -X POST "https://coolify.bhavesh.hk/api/v1/applications/$uuid/start" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" || echo "deploy trigger failed (non-fatal)"
          done