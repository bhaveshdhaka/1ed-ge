name: Deploy Prod

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, server-b]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post-deploy bookkeeping (changelog, build stamp, tokenomics)
        env:
          DATA_DIR: /srv/1edge/data
          DATA_PATH: /srv/1edge/content
          MEDIA_PATH: /srv/1edge/media
          SITE_ENV: prod
          SITE_URL: https://1ed.ge
          SITE_PORT: 4321
        run: node scripts/post-deploy.mjs

      - name: Fetch market news
        env:
          DATA_PATH: /srv/1edge/content
        run: node scripts/market-news-fetch.mjs --no-build

      - name: Build container (fresh checkout)
        run: |
          # Build from the runner's fresh checkout (this workspace), so the
          # image ships the merged code. Avoids rsync --delete against the
          # production /srv/1edge tree (which holds volumes + .env).
          docker build -t 1edge-site .

      - name: Deploy container (existing /srv/1edge config)
        run: |
          # Restart using /srv/1edge's compose file, which owns the .env and
          # the content/media/data volumes. --no-build reuses the image built
          # above; the compose build: . is ignored.
          cd /srv/1edge && docker compose -f /srv/1edge/docker-compose.yml up -d --no-build

      - name: Verify live
        env:
          SITE_ENV: prod
          SITE_URL: https://1ed.ge
          SITE_PORT: 4321
          SITE_RESOLVE: 1ed.ge:443:104.21.7.179
        run: bash scripts/verify-env.sh prod

      - name: Status snapshot
        env:
          DATA_DIR: /srv/1edge/data
        run: node scripts/status-snapshot.mjs
