name: Deploy Prod

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, server-b]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post-deploy bookkeeping (changelog, build stamp, tokenomics)
        env:
          DATA_DIR: /srv/1edge/data
          DATA_PATH: /srv/1edge/content
          MEDIA_PATH: /srv/1edge/media
          SITE_ENV: prod
          SITE_URL: https://1ed.ge
          SITE_PORT: 4321
        run: node scripts/post-deploy.mjs

      - name: Fetch market news
        env:
          DATA_PATH: /srv/1edge/content
        run: node scripts/market-news-fetch.mjs --no-build

      - name: Build container (fresh checkout)
        run: |
          # Build from the runner's fresh checkout (this workspace), so the
          # image ships the merged code — no code sync into the production
          # /srv/1edge tree (which holds volumes + .env).
          docker build -t 1edge-site .

      - name: Deploy container (existing /srv/1edge config)
        run: |
          # Ship the repo's docker-compose.yml to /srv/1edge (host mounts + env),
          # then restart using it. --no-build reuses the fresh image built above.
          # --remove-orphans + --force-recreate handle the container-name conflict
          # when switching between compose definitions (old 1edge-site is seen as
          # an orphan by the shipped compose file).
          cp ./docker-compose.yml /srv/1edge/docker-compose.yml
          cd /srv/1edge && docker compose -f /srv/1edge/docker-compose.yml up -d --no-build --remove-orphans --force-recreate

      - name: Verify live
        env:
          SITE_ENV: prod
          SITE_URL: https://1ed.ge
          SITE_PORT: 4321
          SITE_RESOLVE: 1ed.ge:443:104.21.7.179
        run: |
          # The container was just force-recreated; nginx returns 502 until the
          # app boots. Wait for a 200 before running the full verify.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 --resolve "1ed.ge:443:104.21.7.179" https://1ed.ge/ || true)
            echo "ready check $i: $code"
            [ "$code" = "200" ] && break
            sleep 3
          done
          bash scripts/verify-env.sh prod

      - name: Status snapshot
        env:
          DATA_DIR: /srv/1edge/data
        run: node scripts/status-snapshot.mjs
