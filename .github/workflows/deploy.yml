name: Deploy Prod

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, server-b]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post-deploy bookkeeping (changelog, build stamp, tokenomics)
        env:
          DATA_DIR: /srv/1edge/data
          DATA_PATH: /srv/1edge/content
          MEDIA_PATH: /srv/1edge/media
          SITE_ENV: prod
          SITE_URL: https://1ed.ge
          SITE_PORT: 4321
        run: node scripts/post-deploy.mjs

      - name: Fetch market news
        env:
          DATA_PATH: /srv/1edge/content
        run: node scripts/market-news-fetch.mjs --no-build

      - name: Sync code to /srv/1edge
        run: |
          # rsync isn't installed on the runner; use tar (universally available).
          # Copy the fresh checkout into /srv/1edge, excluding runtime/env dirs.
          tar -C . -cf - --exclude='./data' --exclude='./.env' --exclude='./.env.production' --exclude='./.env.test' --exclude='./content' --exclude='./media' --exclude='./node_modules' . | tar -C /srv/1edge -xf -
          cd /srv/1edge && docker compose -f /srv/1edge/docker-compose.yml up -d --build

      - name: Verify live
        env:
          SITE_ENV: prod
          SITE_URL: https://1ed.ge
          SITE_PORT: 4321
          SITE_RESOLVE: 1ed.ge:443:104.21.7.179
        run: bash scripts/verify-env.sh prod

      - name: Status snapshot
        env:
          DATA_DIR: /srv/1edge/data
        run: node scripts/status-snapshot.mjs
