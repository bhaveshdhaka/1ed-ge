name: Deploy Test

on:
  push:
    branches: [preprod]

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, server-a]
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: npm ci

      - name: Build (test env)
        run: DATA_PATH=/var/data/test/content MEDIA_PATH=/var/data/test/media npm run build

      - name: Restart test server
        run: |
          pkill -F /tmp/1edge-test.pid 2>/dev/null || true
          nohup node dist/server/entry.mjs > /tmp/1edge-test.log 2>&1 &
          echo $! > /tmp/1edge-test.pid

      - name: Verify live
        run: bash scripts/verify-env.sh test
