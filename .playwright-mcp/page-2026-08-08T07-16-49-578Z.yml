        - heading "/ about" [level=1] [ref=f9e27]
        - generic [ref=f9e28]: why this exists
      - paragraph [ref=f9e29]: i want to run a hedge fund. but before anyone — including me — should trust me with money, i need to prove i can trade. properly. consistently. without hiding the bad days.
      - paragraph [ref=f9e30]: so everything goes public. every trade. every account. every journal entry. every habit logged. the numbers are the numbers, and R — points risked vs points made — is the centerpiece. it is the one metric that survives changing account sizes, changing firms, and changing bankrolls.
      - heading "/ the rules" [level=2] [ref=f9e31]
      - list [ref=f9e32]:
        - listitem [ref=f9e33]:
          - generic [ref=f9e34]: "01"
          - generic [ref=f9e35]: risk the same fixed $ amount every single trade. no scaling into size when angry.
        - listitem [ref=f9e36]:
          - generic [ref=f9e37]: "02"
          - generic [ref=f9e38]: only my A+ setups. if it is not a setup, it is not a trade.
        - listitem [ref=f9e39]:
          - generic [ref=f9e40]: "03"
          - generic [ref=f9e41]: no revenge trades. no "getting it back" in the same session.
        - listitem [ref=f9e42]:
          - generic [ref=f9e43]: "04"
          - generic [ref=f9e44]: a loss is information, not an insult. log it like a win.
        - listitem [ref=f9e45]:
          - generic [ref=f9e46]: "05"
          - generic [ref=f9e47]: if i would not publish it, i do not do it.
        - listitem [ref=f9e48]:
          - generic [ref=f9e49]: "06"
          - generic [ref=f9e50]: drawdown is the killer. the account buffer is the seatbelt.
